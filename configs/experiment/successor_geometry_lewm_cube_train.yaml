schema_version: 1
id: successor_geometry_lewm_cube_seed399_screen
method: successor_geometry_lewm
display_name: Directed Successor-Geometry LeWM
environment: cube
stage: full_training
initialization: random_from_scratch

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm

seeds: [399]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  optimized_layout:
    file: cube_single_expert_chunk1.h5
    pixels_chunk_frames: 1
    lossless: true
    sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  lance:
    suffix: .lance
    manifest_suffix: .manifest.json
    stable_worldmodel_version: 0.1.1
    image_codec: jpeg
    jpeg_quality: 100
    minimum_pixel_verification_samples: 128
    numeric_verification:
      action: exact
      observation: float32_cast_exact
    source:
      file: cube_single_expert_chunk1.h5
      size_bytes: 74104077358
      sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  expected_episodes: 10000
  expected_transitions: 2010000
  keys_to_load: [pixels, action, observation]
  keys_to_cache: [action, observation]
  keys_to_merge:
    proprio: observation

split:
  unit: sequence_clip
  implementation: torch.utils.data.random_split
  train_fraction: 0.9
  validation_fraction: 0.1
  seed_source: training_seed
  exact_indices_artifact: split_indices.npz

sequence:
  frame_skip: 5
  history_frames: 3
  prediction_frames: 1
  rollout_horizon: 5
  max_future_offset: 5
  # This gives 16 local SIGReg windows per clip: 8 clips x 16 = 128.
  num_steps: 19

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

normalization:
  fit_population: complete_dataset
  columns: [action, observation]
  boundary_nan_policy: preserve_during_preprocessing_then_zero_actions_before_forward

model:
  parameters: 18034628
  encoder_size: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_embedding_dropout: 0.0
  projector_hidden_dim: 2048

objective:
  dynamics: open_loop_latent_mse_h1_to_hK
  successor_geometry: discounted_future_pair_infonce
  query_sources: [real_terminal, predicted_terminal]
  negative_sampling: cross_episode_in_batch
  same_episode_negatives: masked
  goal_conditioning: none
  reward: none
  policy: none
  td_bootstrap: false
  dynamics_weight: 1.0
  geometry_weight: 1.0

geometry:
  objective_version: 1
  architecture: dual_mlp_directed_cosine
  projection_dim: 128
  hidden_dim: 256
  temperature: 0.1
  gamma: 0.95
  max_future_offset: 5
  rollout_horizon: 5
  query_mix: equal_real_and_predicted
  loss_normalization: cross_episode_random_baseline

loss:
  sigreg:
    weight: 0.09
    knots: 17
    num_projections: 1024
    effective_batch_size: 128

loader:
  batch_size: 8
  stride_aware_lance: true
  device_image_preprocessing: true
  workers: 6
  prefetch_factor: 2
  validation_workers: 2
  validation_locality: true
  block_size: 2048
  episode_streaming: true
  episode_pool_size: 384
  episode_read_size: 16
  episode_cache_bytes: 6442450944
  episode_prefetch_blocks: 16
  minimum_unique_episodes_per_batch: 8
  train_shuffle: true
  train_drop_last: true
  validation_shuffle: false
  validation_drop_last: true
  pin_memory: true

logging:
  type: csv
  flush_every_n_steps: 50

optimizer:
  type: AdamW
  world_model_learning_rate: 0.00005
  geometry_learning_rate: 0.0001
  weight_decay: 0.001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  # Three bounded screening epochs expose an epoch-1 checkpoint quickly.
  epochs: 3
  scheduler_epochs: 3
  optimizer_steps_per_epoch: 4000
  validation_batches: 512
  precision: bf16-mixed
  model_compile: false
  model_compile_mode: reduce-overhead
  gradient_clip_norm: 1.0
  checkpoint_every_epochs: 1
  resume: true

provenance:
  base_protocol: configs/experiment/lewm_cube_train.yaml
  method_definition: configs/methods/successor_geometry_lewm.yaml
  comparison_protocol: configs/experiment/lewm_cube_checkpoint_o50.yaml
  budget_status: single_seed_screening_not_a_final_performance_claim
  note: The standard 50-episode planner protocol must be used before any comparison claim.
