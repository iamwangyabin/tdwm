schema_version: 1
id: e2e_joint_td_gt_lewm_cube_full
method: e2e_joint_td_gt_lewm
display_name: E2E Joint TD-GT-LeWM
environment: cube
stage: full_training
initialization: random_from_scratch

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm

seeds: [3072]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  optimized_layout:
    file: cube_single_expert_chunk1.h5
    pixels_chunk_frames: 1
    lossless: true
    sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  lance:
    suffix: .lance
    manifest_suffix: .manifest.json
    stable_worldmodel_version: 0.1.1
    image_codec: jpeg
    jpeg_quality: 100
    minimum_pixel_verification_samples: 128
    numeric_verification:
      action: exact
      observation: float32_cast_exact
    source:
      file: cube_single_expert_chunk1.h5
      size_bytes: 74104077358
      sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  expected_episodes: 10000
  expected_transitions: 2010000
  keys_to_load: [pixels, action, observation]
  keys_to_cache: [action, observation]
  keys_to_merge:
    proprio: observation

split:
  unit: sequence_clip
  implementation: torch.utils.data.random_split
  train_fraction: 0.9
  validation_fraction: 0.1
  seed_source: training_seed
  exact_indices_artifact: split_indices.npz

sequence:
  frame_skip: 5
  history_frames: 3
  prediction_frames: 1
  prediction_windows: 8
  model_rollout_horizon: 5
  max_goal_offset: 16
  num_steps: 24

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

normalization:
  fit_population: complete_dataset
  columns: [action, observation]
  boundary_nan_policy: preserve_during_preprocessing_then_zero_actions_before_forward

model:
  parameters: 18034628
  encoder_size: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_embedding_dropout: 0.0
  projector_hidden_dim: 2048

joint_objective:
  prediction: teacher_forced_lewm_mse
  regularization: sigreg
  tail: one_step_td_on_predicted_terminal_history
  prediction_weight: 1.0
  tail_weight: 1.0
  tail_input: five_step_differentiable_lewm_rollout
  backpropagate_tail_through_rollout: true

tail_value:
  objective_version: 1
  objective: one_step_td
  history_dim: 626
  action_block_dim: 25
  hidden_dim: 512
  gamma: 0.95
  goal_sampling: uniform_future_offset
  target_network: true
  target_ema_decay: 0.995
  terminate_bootstrap_at_goal: true
  loss_warmup_fraction: 0.05

loss:
  prediction: mse
  sigreg:
    weight: 0.09
    knots: 17
    num_projections: 1024
    effective_batch_size: 128

loader:
  # 16 raw clips x 8 local windows preserves LeWM's SIGReg batch of 128.
  batch_size: 16
  stride_aware_lance: true
  device_image_preprocessing: true
  workers: 6
  prefetch_factor: 2
  validation_workers: 2
  validation_locality: true
  block_shuffle: false
  block_size: 2048
  block_prefetch: false
  block_prefetch_size: 512
  shuffle_batches_within_block: true
  episode_streaming: true
  episode_pool_size: 384
  episode_read_size: 16
  episode_cache_bytes: 6442450944
  episode_prefetch_blocks: 16
  minimum_unique_episodes_per_batch: 16
  train_shuffle: true
  train_drop_last: true
  validation_shuffle: false
  validation_drop_last: false
  pin_memory: true

logging:
  type: csv
  flush_every_n_steps: 50

optimizer:
  type: AdamW
  world_model_learning_rate: 0.00005
  value_learning_rate: 0.0003
  weight_decay: 0.001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  epochs: 10
  scheduler_epochs: 10
  optimizer_steps_per_epoch: 12796
  precision: bf16-mixed
  model_compile: false
  model_compile_mode: reduce-overhead
  gradient_clip_norm: 1.0
  checkpoint_every_epochs: 1
  resume: true
  checkpoint_selection: minimum_validation_joint_loss

planner:
  connected_after_training: true
  solver: unchanged_lewm_cem
  horizon: 5
  cost: terminal_latent_goal_distance_plus_goal_tail_value

provenance:
  baseline_protocol: configs/experiment/lewm_cube_train.yaml
  supersedes_diagnostic: configs/experiment/joint_td_gt_lewm_cube_train.yaml
  note: This run does not load a LeWM checkpoint or latent cache. Every LeWM parameter and the goal-tail value are optimized together from raw Cube images for the full 127,960-update budget.
