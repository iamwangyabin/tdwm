schema_version: 1
id: reacher
display_name: Reacher (DMControl qpos-match)
task: precise_continuous_control

dataset:
  source:
    repository: quentinll/lewm-reacher
    repository_type: dataset
    archive: reacher.tar.zst
    compressed_size_bytes: 23750614946
    manual_decompression_required: true
  installed:
    root_environment_variable: STABLEWM_HOME
    train_name: reacher.h5
    eval_name: dmc/reacher_random.h5
    format: hdf5
    verify_after_extraction: true
    note: The released train and eval configs use different relative names; verify both after extraction.
  paper:
    episodes: 10000
    episode_steps: 200
    behavior: sac
  training_loader:
    keys_to_load: [pixels, action, observation]
    keys_to_cache: [action, observation]
    split:
      unit: episode
      seed: 42
      train: 0.9
      validation: 0.1
  evaluation_loader:
    keys_to_load: all
    keys_to_cache: [action]

world:
  env_name: swm/ReacherDMControl-v0
  image_size: 224
  max_episode_steps: 50
  kwargs:
    task: qpos_match

evaluation:
  mode: dataset
  episodes: 50
  goal_offset_steps: 25
  budget_steps: 50
  seed: 42
  callables:
    - method: set_state
      args:
        qpos:
          dataset_key: qpos
        qvel:
          dataset_key: qvel
    - method: set_target_qpos
      args:
        target_qpos:
          dataset_key: goal_qpos

planning:
  solver: cem
  horizon: 5
  receding_horizon: 5
  action_block: 5
  candidates: 300
  elites: 30
  iterations: 10
  initial_variance: 1.0
