schema_version: 1
id: tworoom
display_name: Two-Room
task: 2d_navigation

dataset:
  source:
    repository: quentinll/lewm-tworooms
    repository_type: dataset
    archive: tworoom.tar.zst
    compressed_size_bytes: 3425937909
    manual_decompression_required: true
  installed:
    root_environment_variable: STABLEWM_HOME
    train_name: tworoom.h5
    eval_name: tworoom.h5
    format: hdf5
  paper:
    episodes: 10000
    average_episode_steps: 92
    behavior: noisy_two_stage_heuristic
  training_loader:
    keys_to_load: [pixels, action, proprio]
    keys_to_cache: [action, proprio]
    split:
      unit: episode
      seed: 42
      train: 0.9
      validation: 0.1
  evaluation_loader:
    keys_to_load: all
    keys_to_cache: [action, proprio]

method_overrides:
  latent_world_model:
    sequence:
      history_size: 1
      num_steps: 2

world:
  env_name: swm/TwoRoom-v1
  image_size: 224
  max_episode_steps: 50

evaluation:
  mode: dataset
  episodes: 50
  goal_offset_steps: 25
  budget_steps: 50
  seed: 42
  callables:
    - method: _set_state
      args:
        state:
          dataset_key: proprio
    - method: _set_goal_state
      args:
        goal_state:
          dataset_key: goal_proprio

planning:
  solver: cem
  horizon: 5
  receding_horizon: 5
  action_block: 5
  candidates: 300
  elites: 30
  iterations: 10
  initial_variance: 1.0
