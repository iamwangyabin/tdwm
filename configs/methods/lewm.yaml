schema_version: 1
id: lewm
display_name: LeWM
family: latent_world_model
protocol: offline_reward_free

implementation:
  package: stable-worldmodel[all]
  version: 0.1.1
  api: swm.wm.lewm.LeWM

input:
  pixels: true
  proprioception: false
  action_dimension: infer_from_dataset
  image_size: 224

sequence:
  frameskip: 5
  history_size: 3
  num_predictions: 1
  num_steps: 4

model:
  encoder:
    type: vit_tiny
    pretrained: false
    patch_size: 14
    embedding_dimension: 192
  predictor:
    depth: 6
    heads: 16
    mlp_dimension: 2048
    head_dimension: 64
    dropout: 0.1
  projector:
    hidden_dimension: 2048
    normalization: batch_norm_1d

loss:
  prediction: mse
  sigreg:
    weight: 0.09
    projections: 1024
    integration_knots: 17

training:
  epochs: 10
  batch_size: 128
  train_fraction: 0.9
  precision: bf16-mixed
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    learning_rate: 0.00005
    weight_decay: 0.001

checkpoint:
  resume: true
  save_every_epochs: 1

provenance:
  paper: https://arxiv.org/pdf/2603.19312
  released_config: https://github.com/lucas-maes/le-wm/tree/main/config/train
  note: Paper protocol uses 10 epochs; released SIGReg weight is 0.09 while the paper rounds the default to 0.1.
