schema_version: 1
id: gt_lewm_cube_checkpoint_o25
method: gt_lewm
environment: cube

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm
  precision: fp32

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  expected_episodes: 10000
  expected_transitions: 2010000
  episode_steps: 201
  lance:
    manifest_suffix: .manifest.json
    image_codec: jpeg
    jpeg_quality: 100
  keys_to_load:
    - pixels
    - action
    - qpos
    - qvel
    - privileged_block_0_pos
    - privileged_block_0_quat
  training_split:
    status: gt_lewm_training_split
    note: The value head is trained on the same clip split as its base LeWM model.
  evaluation_split:
    population: all valid start rows across all 10000 dataset episodes
    sampler: stable-worldmodel-0.1.1-valid-row-sampler
    replacement: false

checkpoint:
  source: local_gt_lewm_training_base_export
  parameters: 18034628

tail_value:
  horizon: 8
  gamma: 0.95

world:
  env_name: swm/OGBCube-v0
  env_type: single
  ob_type: states
  image_size: 224
  multiview: false
  visualize_info: false
  terminate_at_goal: true
  success_threshold_meters: 0.04
  success_definition: target cube center is within 0.04 m of the target position

evaluation:
  episodes: 50
  goal_offset: 25
  start_goal_source: same dataset episode

context:
  training_history_frames: 3
  predictor_recurrent_window: 3
  plan_config_history_len: 1
  effective_observed_frames_at_first_plan: 1

planning:
  solver: CEM
  objective: discounted_latent_path_cost_plus_terminal_tail_value
  horizon: 5
  candidates: 300
  iterations: 30
  elites: 30
  initial_variance: 1.0
  action_block: 5
  frame_skip: 5
  receding_horizon: 5
  executed_environment_steps_before_replanning: 25
  episode_budget: 50
  planning_seed: 42
  solver_batch_size: 1
  warm_start: true
