schema_version: 1
id: policy_auxiliary_successor_geometry_lewm_cube_checkpoint_o50
method: policy_auxiliary_successor_geometry_lewm
display_name: Policy-Auxiliary Successor-Geometry LeWM
environment: cube
stage: planner_evaluation

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm
  precision: fp32

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  expected_episodes: 10000
  expected_transitions: 2010000
  episode_steps: 201
  lance:
    manifest_suffix: .manifest.json
    image_codec: jpeg
    jpeg_quality: 100
  keys_to_load:
    - pixels
    - action
    - qpos
    - qvel
    - privileged_block_0_pos
    - privileged_block_0_quat

checkpoint:
  source: paired_local_successor_geometry_export
  base_checkpoint_path: required_cli_argument
  geometry_checkpoint_path: required_cli_argument

geometry:
  objective_version: 1
  architecture: dual_mlp_directed_cosine
  embed_dim: 192
  projection_dim: 128
  hidden_dim: 256
  temperature: 0.1
  gamma: 0.95
  history_size: 3
  rollout_horizon: 5
  max_future_offset: 5
  query_sources: [real_terminal, predicted_terminal]
  goal_conditioning: future_pairs_only
  negative_sampling: cross_episode_in_batch
  same_episode_negatives: masked
  reward: none
  policy: expert_action_auxiliary_training_only
  policy_used_at_inference: false
  latent_transition: absolute_next_latent
  td_bootstrap: false
  planning_cost: one_minus_directed_cosine

world:
  env_name: swm/OGBCube-v0
  env_type: single
  ob_type: states
  image_size: 224
  multiview: false
  visualize_info: false
  terminate_at_goal: true
  success_threshold_meters: 0.04

evaluation:
  episodes: 50
  goal_offset: 50
  start_goal_source: same_dataset_episode

planning:
  solver: CEM
  horizon: 5
  candidates: 300
  iterations: 30
  elites: 30
  initial_variance: 1.0
  action_block: 5
  frame_skip: 5
  receding_horizon: 1
  episode_budget: 100
  planning_seed: 42
  solver_batch_size: 1
  history_len: 1
  warm_start: true
  initial_distribution: cem_gaussian_no_actor

inference_objective:
  input: lewm_predicted_terminal_for_explicit_cem_action_prefix
  score: directed_successor_geometry_to_goal
  euclidean_latent_cost: disabled_in_primary_configuration
  learned_action_policy: false
  training_only_action_head_loaded: false
  replanning: every_action_block

provenance:
  training_protocol: configs/experiment/policy_auxiliary_successor_geometry_lewm_cube_train.yaml
  comparison_protocol: configs/experiment/successor_geometry_lewm_cube_checkpoint_o50.yaml
  baseline_result: successor_geometry_lewm_seed399_epoch03_o50_46_percent
  rejected_ablation: residual_policy_successor_geometry_lewm_seed399_o50_32_percent
  status: implementation_ready_checkpoint_pending
