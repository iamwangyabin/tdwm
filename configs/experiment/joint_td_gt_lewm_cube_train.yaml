schema_version: 1
id: joint_td_gt_lewm_cube_full
method: joint_td_gt_lewm
display_name: Joint TD-GT-LeWM
environment: cube
stage: full_training

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm

seeds: [3072]

base_model:
  method: lewm
  initialization: checkpoint
  history_size: 3
  latent_dim: 192
  parameters: 18034628
  frozen_components: [encoder, projector]
  trainable_components: [predictor, action_encoder, pred_proj]
  frozen_running_statistics: [pred_proj]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  optimized_layout:
    file: cube_single_expert_chunk1.h5
    pixels_chunk_frames: 1
    lossless: true
    sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  lance:
    suffix: .lance
    manifest_suffix: .manifest.json
    stable_worldmodel_version: 0.1.1
    image_codec: jpeg
    jpeg_quality: 100
    minimum_pixel_verification_samples: 128
    numeric_verification:
      action: exact
      observation: float32_cast_exact
    source:
      file: cube_single_expert_chunk1.h5
      size_bytes: 74104077358
      sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  expected_episodes: 10000
  expected_transitions: 2010000
  keys_to_load: [action]

split:
  unit: episode
  train_fraction: 0.9
  validation_fraction: 0.1
  seed: 42

sequence:
  frame_skip: 5
  history_frames: 3
  model_rollout_horizon: 5
  max_goal_offset: 16
  num_steps: 24

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

latent_cache:
  dtype: float32
  batch_size: 256
  workers: 0
  prefetch_factor: 2
  pin_memory: true
  log_every_batches: 100

joint_objective:
  prediction: teacher_forced_lewm_mse
  prediction_weight: 1.0
  tail_input: predicted_terminal_history
  tail_weight: 1.0
  backpropagate_tail_through_rollout: true

tail_value:
  objective: one_step_td
  hidden_dim: 512
  gamma: 0.95
  goal_sampling: uniform_future_offset
  target_network: true
  target_ema_decay: 0.995
  terminate_bootstrap_at_goal: true

initialization:
  dynamics: reproduced_lewm_checkpoint
  value: random
  target: copy_of_initial_value
  standalone_tail_warm_start: false

loader:
  batch_size: 256
  validation_batch_size: 512
  workers: 4
  prefetch_factor: 2
  pin_memory: true
  train_drop_last: false

optimizer:
  type: AdamW
  dynamics_learning_rate: 0.00001
  value_learning_rate: 0.0003
  weight_decay: 0.0001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  epochs: 10
  coverage: all_training_clips_each_epoch
  validate_before_training: true
  checkpoint_selection: minimum_validation_joint_loss
  gradient_clip_norm: 1.0
  precision: bf16-mixed
  resume: true

planner:
  connected_after_training: true
  horizon: 5
  cost: terminal_latent_goal_distance_plus_goal_tail_value

provenance:
  base_protocol: configs/experiment/lewm_cube_train.yaml
  diagnostic_protocol: configs/experiment/td_gt_lewm_cube_train.yaml
  note: The diagnostic frozen head is not used for initialization. The TD tail is trained on a five-step LeWM rollout and its gradient updates the LeWM dynamics.
