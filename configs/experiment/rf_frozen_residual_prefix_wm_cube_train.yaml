schema_version: 1
id: rf_frozen_residual_prefix_wm_cube_v1
method: rf_frozen_residual_prefix_wm
display_name: Frozen-LeWM Residual Prefix World Model
environment: cube
stage: full_training
initialization: frozen_pretrained_lewm

pretrained_world_model:
  source_method: lewm
  source_seed: 3072
  source_epoch: 10
  checkpoint_sha256: 0ce38860a672c4a304d6921c6f07158977bb1d2c8f0eed8a002bb7c89502b579
  frozen: true

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm

seeds: [0, 42, 3072]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  optimized_layout:
    file: cube_single_expert_chunk1.h5
    pixels_chunk_frames: 1
    lossless: true
    sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  lance:
    suffix: .lance
    manifest_suffix: .manifest.json
    stable_worldmodel_version: 0.1.1
    image_codec: jpeg
    jpeg_quality: 100
    minimum_pixel_verification_samples: 128
    numeric_verification:
      action: exact
      observation: float32_cast_exact
    source:
      file: cube_single_expert_chunk1.h5
      size_bytes: 74104077358
      sha256: 3cf6477768f1a2979acefa3aeb6c27c45422b8b6fbce8527419943d3e679a245
  expected_episodes: 10000
  expected_transitions: 2010000
  keys_to_load: [pixels, action, observation]
  keys_to_cache: [action, observation]
  keys_to_merge:
    proprio: observation

split:
  unit: sequence_clip
  implementation: torch.utils.data.random_split
  train_fraction: 0.9
  validation_fraction: 0.1
  seed_source: training_seed
  exact_indices_artifact: split_indices.npz

sequence:
  frame_skip: 5
  history_frames: 3
  prediction_frames: 1
  rollout_horizon: 5
  num_steps: 19

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

normalization:
  fit_population: complete_dataset
  columns: [action, observation]
  boundary_nan_policy: preserve_during_preprocessing_then_zero_actions_before_forward

model:
  parameters: 18034628
  encoder_size: tiny
  patch_size: 14
  embed_dim: 192
  predictor_depth: 6
  predictor_heads: 16
  predictor_mlp_dim: 2048
  predictor_dim_head: 64
  predictor_dropout: 0.1
  predictor_embedding_dropout: 0.0
  projector_hidden_dim: 2048

joint_objective:
  primitive_prediction: lewm_residual_future_latent_sequence
  single_step: horizon_one_residual_corrected_latent
  multi_step_prediction: all_horizon_residual_corrected_latents
  consistency: exact_base_plus_residual_successor_cumsum
  target_encoder: frozen_pretrained
  base_predictor: frozen_pretrained_lewm_rollout
  goal_conditioning: none
  policy: none
  bootstrap: none
  latent_sequence_weight: 1.0

successor:
  objective_version: 10
  architecture: causal_transformer_lewm_residual
  prefix_depth: 2
  prefix_heads: 6
  prefix_mlp_dim: 768
  predictor_depth: 3
  predictor_mlp_dim: 1024
  fusion_dim: 512
  dropout: 0.1
  max_horizon: 5
  gamma: 0.95
  feature_basis: augmented_latent_squared_distance
  horizon_normalization: discounted_prefix_mean
  target: frozen_pretrained_residual_latents
  pretrained_world_model_sha256: 0ce38860a672c4a304d6921c6f07158977bb1d2c8f0eed8a002bb7c89502b579
  latent_recovery: base_plus_residual_manifold_latents
  action_conditioning: causal_prefix
  goal_conditioning: none
  continuation_policy: none
  td_bootstrap: false
  planning_weight: 1.0
  terminal_weight: 0.0
  clamp_successor_cost: true

loss:
  sigreg:
    weight: 0.0
    knots: 17
    num_projections: 1024
    effective_batch_size: 128

loader:
  batch_size: 8
  stride_aware_lance: true
  device_image_preprocessing: true
  workers: 6
  prefetch_factor: 2
  validation_workers: 2
  validation_locality: true
  block_shuffle: false
  block_size: 2048
  episode_streaming: true
  episode_pool_size: 384
  episode_read_size: 16
  episode_cache_bytes: 6442450944
  episode_prefetch_blocks: 16
  minimum_unique_episodes_per_batch: 8
  train_shuffle: true
  train_drop_last: true
  validation_shuffle: false
  validation_drop_last: false
  pin_memory: true

logging:
  type: csv
  flush_every_n_steps: 50

optimizer:
  type: AdamW
  world_model_learning_rate: 0.0
  successor_learning_rate: 0.00005
  weight_decay: 0.001

scheduler:
  type: linear_warmup_cosine_annealing
  interval: optimizer_step
  warmup_fraction: 0.01

training:
  epochs: 10
  scheduler_epochs: 10
  freeze_world_model_from_start: true
  stop_after_epoch: 1
  optimizer_steps_per_epoch: 12796
  precision: bf16-mixed
  model_compile: false
  model_compile_mode: reduce-overhead
  gradient_clip_norm: 1.0
  checkpoint_every_epochs: 1
  resume: true

provenance:
  base_protocol: configs/experiment/rf_frozen_manifold_prefix_successor_wm_cube_train.yaml
  method_definition: configs/methods/rf_frozen_residual_prefix_wm.yaml
  status: implementation_ready_untrained
  note: Preserve the audited LeWM rollout exactly at initialization and learn one all-horizon residual loss.
