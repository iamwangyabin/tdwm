schema_version: 1
id: lewm
display_name: LeWM
family: latent_world_model
protocol: offline_reward_free

implementation:
  package: stable-worldmodel[all]
  version: 0.1.1
  api: swm.wm.lewm.LeWM

# Exact published architecture targets. The TDWM training entry passes this
# declarative config to Hydra; it never copies or modifies the upstream model.
factory:
  _target_: stable_worldmodel.wm.LeWM
  encoder:
    _target_: transformers.ViTModel
    config:
      _target_: transformers.ViTConfig
      hidden_size: 192
      num_hidden_layers: 12
      num_attention_heads: 3
      intermediate_size: 768
      image_size: 224
      patch_size: 14
      num_channels: 3
      qkv_bias: true
    add_pooling_layer: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: 3
    input_dim: 192
    hidden_dim: 192
    output_dim: 192
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: infer_from_dataset
    emb_dim: 192
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: 192
    output_dim: 192
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: 192
    output_dim: 192
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

input:
  pixels: true
  proprioception: false
  action_dimension: infer_from_dataset
  image_size: 224

sequence:
  frameskip: 5
  history_size: 3
  num_predictions: 1
  num_steps: 4

model:
  encoder:
    type: vit_tiny
    pretrained: false
    patch_size: 14
    embedding_dimension: 192
  predictor:
    depth: 6
    heads: 16
    mlp_dimension: 2048
    head_dimension: 64
    dropout: 0.1
  projector:
    hidden_dimension: 2048
    normalization: batch_norm_1d

loss:
  prediction: mse
  sigreg:
    weight: 0.09
    projections: 1024
    integration_knots: 17

training:
  epochs: 10
  batch_size: 128
  train_fraction: 0.9
  precision: bf16-mixed
  gradient_clip: 1.0
  optimizer:
    type: AdamW
    learning_rate: 0.00005
    weight_decay: 0.001

checkpoint:
  resume: true
  save_every_epochs: 1

provenance:
  paper: https://arxiv.org/pdf/2603.19312
  released_config: https://github.com/lucas-maes/le-wm/tree/main/config/train
  note: Paper protocol uses 10 epochs; released SIGReg weight is 0.09 while the paper rounds the default to 0.1.
