[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tdwm"
version = "0.1.0"
description = "Auditable world-model experiments built on Stable World Model"
requires-python = ">=3.10"
dependencies = [
  "stable-worldmodel[all]==0.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
