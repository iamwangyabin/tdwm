schema_version: 1
id: gt_lewm
display_name: Goal-conditioned Tail-Value LeWM
family: latent_world_model
protocol: offline_reward_free

implementation:
  package: stable-worldmodel[all]
  version: 0.1.1
  base_api: swm.wm.lewm.LeWM
  adapter: tdwm.adapters.GoalTailLeWM

representation:
  encoder: shared_with_lewm
  latent_dimension: 192
  anti_collapse: swm.wm.SIGReg

local_dynamics:
  equation: z_next = F(z, action)
  history_frames: 3
  prediction_frames: 1

tail_value:
  form: V(z, goal)
  input_features: [z, goal, z_minus_goal]
  hidden_dimension: 192
  horizon: 8
  gamma: 0.95
  target: ema_bootstrapped_n_step_latent_goal_cost
  target_tau: 0.99
  loss_weight: 0.1
  goal_source: n_step_episode_endpoint

planning:
  objective: discounted_latent_path_cost_plus_terminal_tail_value
  solver: swm.solver.CEMSolver
  replanning: receding_horizon
