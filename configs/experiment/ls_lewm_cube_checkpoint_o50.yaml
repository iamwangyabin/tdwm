schema_version: 1
id: ls_lewm_cube_checkpoint_o50
method: ls_lewm
environment: cube

runtime:
  stable_worldmodel_version: 0.1.1
  import: import stable_worldmodel as swm
  precision: fp32

image_preprocessing:
  source: stable_pretraining.data.dataset_stats.ImageNet
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

dataset:
  identifier: quentinll/lewm-cube
  file: ogbench/cube_single_expert.h5
  expected_size_bytes: 101942558720
  accepted_size_bytes: [101942558720, 74104077358]
  expected_episodes: 10000
  expected_transitions: 2010000
  episode_steps: 201
  lance:
    manifest_suffix: .manifest.json
    image_codec: jpeg
    jpeg_quality: 100
  keys_to_load:
    - pixels
    - action
    - qpos
    - qvel
    - privileged_block_0_pos
    - privileged_block_0_quat

checkpoint:
  source: local_ls_lewm_export
  base_checkpoint_path: required_cli_argument
  heads_checkpoint_path: required_cli_argument

model:
  embed_dim: 192

successor:
  objective_version: 1
  gamma: 0.95
  history_size: 3
  hidden_dim: 192
  feature_basis: augmented_latent_squared_distance
  goal_offset_weighting: uniform_offsets
  terminal_condition: next_state_is_hindsight_goal
  continuation_policy: hindsight_gcbc
  clamp_tail_cost: true

world:
  env_name: swm/OGBCube-v0
  env_type: single
  ob_type: states
  image_size: 224
  multiview: false
  visualize_info: false
  terminate_at_goal: true
  success_threshold_meters: 0.04

evaluation:
  episodes: 50
  goal_offset: 50
  start_goal_source: same_dataset_episode

planning:
  solver: CEM
  horizon: 5
  candidates: 300
  iterations: 30
  elites: 30
  initial_variance: 1.0
  action_block: 5
  frame_skip: 5
  receding_horizon: 1
  episode_budget: 100
  planning_seed: 42
  solver_batch_size: 1
  history_len: 1
  warm_start: true
  initial_distribution: continuation_policy_rollout

inference_objective:
  prefix: normalized_discounted_latent_goal_cost
  tail: policy_conditioned_vector_successor_goal_cost
  splice: no_overlap_at_terminal_horizon
  replanning: every_action_block
